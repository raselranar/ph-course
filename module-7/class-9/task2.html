<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 2</title>
    <style>
      body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      .grid-container {
        width: 100%;
        height: 100%;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(2, 1fr);
        gap: 10px;
      }

      /* style boxes */
      .box:nth-child(1) {
        background-color: #d34a4a;
        grid-row: span 2;
        grid-column: span 2;
      }
      .box:nth-child(2) {
        background-color: #2abcc7;
        grid-column: span 2;
      }
      .box:nth-child(3) {
        background-color: #318a29;
      }
      .box:nth-child(4) {
        background-color: #bb50ad;
      }
      @media screen and (max-width: 576px) {
        .grid-container {
          grid-template-rows: repeat(4, 200px);
          grid-template-columns: 1fr;
        }
        .grid-container .box {
          grid-column: span 1;
          grid-row: span 1;
        }
      }
    </style>
  </head>
  <body>
    <h2>Task 2: Design a responsive grid layout</h2>
    <div class="grid-container">
      <div class="box">1</div>
      <div class="box">2</div>
      <div class="box">3</div>
      <div class="box">4</div>
    </div>
  </body>
</html>
