<!doctype html>
<html lang="en" data-theme="light" class="font-google-sans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home</title>
    <link rel="shortcut icon" href="./assets/logo.png" type="image/x-icon" />
    <!-- icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!-- styles -->
    <link rel="stylesheet" href="output.css" />
  </head>
  <body>
    <!-- header -->
    <header
      class="bg-base-200 sticky top-0 z-10 flex justify-between border-b border-gray-300/70 px-2.75 py-6 shadow"
    >
      <!-- left side -->
      <div class="flex gap-2">
        <!-- logo -->
        <div class="w-15">
          <img src="./assets/logo.png" alt="logo" />
        </div>
        <!-- balance info -->
        <div class="">
          <h2 class="text-lg font-extrabold">
            $<span id="balance">45000</span>
          </h2>
          <p class="text-neutral/50">Available Balance</p>
        </div>
      </div>
      <!-- right side -->
      <div class="">
        <a href="/index.html" class="btn btn-soft text-neutral/50"
          ><i class="fa-solid fa-arrow-right-from-bracket"></i>Log Out</a
        >
      </div>
    </header>
    <section class="px-6 pt-8">
      <div class="space-y-1">
        <h2 class="text-2xl/7.5 font-bold">Welcome to Payoo</h2>
        <p class="text-neutral/50">
          Enjoy easy and convenient financial services with us. Cashout charge
          is low and
        </p>
      </div>
      <!-- buttons -->
      <div class="grid grid-cols-3 grid-rows-2 gap-4 pt-6">
        <button
          onclick="showOnly('add-money')"
          class="btn h-full flex-col py-5"
        >
          <img src="./assets/opt-1.png" alt="add money" />
          <p class="text-black/60">Add Money</p>
        </button>
        <button onclick="showOnly('cashout')" class="btn h-full flex-col py-5">
          <img src="./assets/opt-2.png" alt="Cashout" />
          <p class="text-black/60">Cashout</p>
        </button>
        <button
          onclick="showOnly('transfer-money')"
          class="btn h-full flex-col py-5"
        >
          <img src="./assets/opt-3.png" alt="Transfer Money" />
          <p class="text-black/60">Transfer Money</p>
        </button>
        <button class="btn h-full flex-col py-5">
          <img src="./assets/opt-4.png" alt="Get Bonus" />
          <p class="text-black/60">Get Bonus</p>
        </button>
        <button class="btn h-full flex-col py-5">
          <img src="./assets/opt-5.png" alt="Pay Bill" />
          <p class="text-black/60">Pay Bill</p>
        </button>
        <button class="btn h-full flex-col py-5">
          <img src="./assets/opt-1.png" alt="Transactions" />
          <p class="text-black/60">Transactions</p>
        </button>
      </div>
    </section>
    <!-- Cashout Section -->
    <section id="cashout" class="mx-6 mt-3.75 hidden">
      <h2 class="text-lg font-semibold">Cash Out</h2>
      <!-- from -->
      <div class="card bg-base-100 mx-auto w-full max-w-sm shrink-0">
        <div class="card-body">
          <fieldset class="fieldset">
            <label class="label text-neutral/70 text-base/5 font-medium"
              >Agent Number</label
            >
            <input
              id="cashout-agent-number"
              type="text"
              class="input w-full border-none"
              minlength="11"
              maxlength="11"
              placeholder="Enter 11 digit number"
            />
            <label class="label text-neutral/70 text-base/5 font-medium"
              >Amount</label
            >
            <input
              id="cashout-amount"
              type="number"
              class="input w-full border-none"
              placeholder="Enter amount to withdraw"
            />
            <label class="label text-neutral/70 text-base/5 font-medium"
              >Pin Number</label
            >
            <input
              id="cashout-pin"
              type="password"
              class="input w-full border-none"
              minlength="4"
              maxlength="4"
              placeholder="Enter 4 digit pin number"
            />
            <button
              id="cashout-btn"
              class="btn btn-primary mt-4 h-fit rounded-full py-2.5 text-xl/6.25 font-semibold"
            >
              Withdraw Money
            </button>
          </fieldset>
        </div>
      </div>
    </section>
    <!-- Add Money Section -->
    <section id="add-money" class="mx-6 mt-3.75 hidden">
      <h2 class="text-lg font-semibold">Add Money</h2>
      <!-- from -->
      <div class="card bg-base-100 mx-auto w-full max-w-sm shrink-0">
        <div class="card-body">
          <fieldset class="fieldset">
            <label class="label text-neutral/70 text-base/5 font-medium"
              >Select A Bank</label
            >
            <select id="add-money-bank" class="select select-ghost">
              <option disabled selected>Select Bank</option>
              <option value="DBBL">DBBL</option>
              <option value="IBBL">IBBL</option>
              <option value="City Bank">City Bank</option>
            </select>

            <label class="label text-neutral/70 text-base/5 font-medium"
              >Bank Account Number</label
            >
            <input
              id="add-money-bank-number"
              type="text"
              minlength="11"
              maxlength="11"
              class="input w-full border-none"
              placeholder="Enter 11 digit account number"
            />
            <label class="label text-neutral/70 text-base/5 font-medium"
              >Amount to Add</label
            >
            <input
              id="add-money-amount"
              type="number"
              class="input w-full border-none"
              placeholder="Add Amount to Balance"
            />
            <label class="label text-neutral/70 text-base/5 font-medium"
              >Pin Number</label
            >
            <input
              id="add-money-pin"
              type="password"
              class="input w-full border-none"
              minlength="4"
              maxlength="4"
              placeholder="Enter 4 digit pin number"
            />
            <button
              id="add-money-btn"
              class="btn btn-primary mt-4 h-fit rounded-full py-2.5 text-xl/6.25 font-semibold"
            >
              Add Money
            </button>
          </fieldset>
        </div>
      </div>
    </section>
    <!-- Send money/transfer money section -->
    <section id="transfer-money" class="mx-6 mt-3.75 hidden">
      <h2 class="text-lg font-semibold">Transfer Money</h2>
      <!-- from -->
      <div class="card bg-base-100 mx-auto w-full max-w-sm shrink-0">
        <div class="card-body">
          <fieldset class="fieldset">
            <label class="label text-neutral/70 text-base/5 font-medium"
              >User Account Number</label
            >
            <input
              id="transfer-account-number"
              type="text"
              class="input w-full border-none"
              minlength="11"
              maxlength="11"
              placeholder="Enter 11 digit number"
            />
            <label class="label text-neutral/70 text-base/5 font-medium"
              >Amount</label
            >
            <input
              id="transfer-amount"
              type="number"
              class="input w-full border-none"
              placeholder="Enter amount to transfer"
            />
            <label class="label text-neutral/70 text-base/5 font-medium"
              >Pin Number</label
            >
            <input
              id="transfer-pin"
              type="password"
              class="input w-full border-none"
              minlength="4"
              maxlength="4"
              placeholder="Enter 4 digit pin number"
            />
            <button
              id="transfer-btn"
              class="btn btn-primary mt-4 h-fit rounded-full py-2.5 text-xl/6.25 font-semibold"
            >
              Send Money
            </button>
          </fieldset>
        </div>
      </div>
    </section>
  </body>
  <script src="./scripts/machine.js"></script>

  <script src="./scripts/addMoney.js"></script>
  <script src="./scripts/transferMoney.js"></script>
  <script src="./scripts/cashout.js"></script>
</html>
