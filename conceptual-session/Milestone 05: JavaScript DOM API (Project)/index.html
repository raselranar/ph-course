<!doctype html>
<html lang="en" class="font-inter">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Green Earth | Plant a Tree</title>

    <!-- Tailwind and Daisy UI CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <header class="bg-green-700 text-white py-4 sticky top-0 z-10 h-18">
      <div class="container flex justify-between mx-auto items-center">
        <!-- logo -->
        <h1 class="text-2xl">Green Earth</h1>
        <!-- Navigation-->
        <nav class="">
          <ul class="flex gap-6 items-center">
            <li>About</li>
            <li>Gallery</li>
            <li>Plant a Tree</li>
          </ul>
        </nav>
        <button
          class="btn rounded-full bg-amber-300 border-none text-green-700"
        >
          Plant a Tree
        </button>
      </div>
    </header>
    <main>
      <!-- banner section -->
      <section class="bg-[#CFF0DC]">
        <!-- container -->
        <div class="mx-auto grid grid-cols-3 justify-between items-center">
          <!-- left side image -->
          <img src="./assets/hero-leaf1.png" alt="a leaf" class="self-end" />
          <!-- content -->
          <div class="flex flex-col items-center py-3 text-center">
            <h2 class="font-bold text-2xl lg:text-7 xl:text-4xl/15">
              Plant a Tree, Grow a Future
            </h2>
            <p class="text-gray-500 mt-2 mb-6">
              Join our mission to plant 1 million trees and make the Earth
              greener for future generations.
            </p>
            <button
              class="btn w-fit rounded-full bg-amber-300 border-none text-green-700"
            >
              Get Involved
            </button>
          </div>
          <!-- right side image -->
          <img class="self-end" src="./assets/hero-leaf2.png" alt="a leaf" />
        </div>
      </section>

      <!-- shopping section -->
      <section class="mt-11 container mx-auto">
        <h2 class="font-semibold text-3xl leading-10 text-center">
          Choose Your Trees
        </h2>
        <!-- container -->
        <section class="flex gap-7.5">
          <!-- Categories -->
          <div class="sticky top-18 h-fit">
            <h3 class="font-semibold text-xl/7">Categories</h3>
            <!-- categories list -->
            <ul class="w-56 mt-2" id="category-list">
              <!-- dynamically add categories -->
            </ul>
          </div>
          <!-- cards -->
          <div class="mt-10 flex-1">
            <!-- card container -->
            <div
              id="card-container"
              class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"
            >
              <!-- add dynamically -->
            </div>
            <div
              id="trees-loading"
              class="flex justify-center items-center h-[30vh] hidden"
            >
              <span class="loading loading-spinner loading-xl"></span>
            </div>
          </div>

          <!-- cart
          <div class=""></div> -->
        </section>
      </section>
    </main>
  </body>
  <!-- JS -->
  <script src="./script.js"></script>
</html>
